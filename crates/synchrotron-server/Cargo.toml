[package]
name = "synchrotron-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "synchrotron-server"
path = "src/main.rs"

[dependencies]
synchrotron-types.workspace = true
synchrotron-core.workspace = true
synchrotron-git = { path = "../synchrotron-git" }
synchrotron-kube = { path = "../synchrotron-kube" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
bytes = "1"
utoipa = { version = "5", features = ["axum_extras"] }
async-stream = "0.3"
futures-core = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
