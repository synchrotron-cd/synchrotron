[package]
name = "synchrotron-git"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
synchrotron-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "https", "ssh"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
serde_json.workspace = true
jsonwebtoken = "9"
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { workspace = true, features = ["test-util", "macros", "rt", "net"] }
axum = "0.8"
