[workspace]
resolver = "2"
members = [
    "crates/synchrotron-types",
    "crates/synchrotron-core",
    "crates/synchrotron-git",
    "crates/synchrotron-kube",
    "crates/synchrotron-server",
    "crates/synchrotron-cli",
    "crates/synchrotron-plugins",
    "crates/synchrotron-helm-plugin",
    "crates/synchrotron-kustomize-plugin",
    "crates/synchrotron-reconcile",
    "crates/synchrotron-health",
    "crates/synchrotron-diff",
    "crates/synchrotron-notifier",
    "crates/synchrotron-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# We ship statically-linked binaries via the release.yml workflow,
# not via crates.io. `publish = false` keeps internal workspace
# crates from accidentally getting published and lets cargo-deny's
# wildcard check treat path-dependencies (synchrotron-* on each
# other) as the workspace-internal links they are.
publish = false

[workspace.dependencies]
# Internal crates
synchrotron-types = { path = "crates/synchrotron-types" }
synchrotron-core = { path = "crates/synchrotron-core" }
synchrotron-git = { path = "crates/synchrotron-git" }
synchrotron-kube = { path = "crates/synchrotron-kube" }
synchrotron-plugins = { path = "crates/synchrotron-plugins" }
synchrotron-diff = { path = "crates/synchrotron-diff" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Benchmarking
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Optimize release builds for size and link-time inlining. Static
# musl binaries are the deployment artifact, so a few extra minutes
# of build time buys meaningful size and runtime wins.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
