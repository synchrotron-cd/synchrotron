version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group patch + minor updates so reviewers get one PR per
    # category instead of N per dep. Major bumps stay individual
    # (they're more likely to need attention).
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
