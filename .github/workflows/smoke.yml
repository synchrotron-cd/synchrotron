name: smoke

# End-to-end smoke test (synchrotron-cd-v18). Different from
# helm.yml (chart-installs-cleanly with placeholder image),
# kind.yml (unit-style integration tests against kind), and
# docker.yml (image builds). This one spins up a kind cluster,
# builds + side-loads the real synchrotron-server image, installs
# the Helm chart pointing at it, and verifies the controller
# actually starts and serves its API.
#
# Validating the full git → render → apply path needs an
# in-cluster git server (the controller fetches by URL); that
# extra hop is filed as a follow-up. This workflow's job is to
# confirm "the chart + image + config compose into a running
# controller" — the bare minimum end-to-end smoke.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'deploy/charts/**'
      - 'tests/smoke/**'
      - '.github/workflows/smoke.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'deploy/charts/**'
      - 'tests/smoke/**'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: kind + helm + real image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64-only here — kind nodes are amd64 in CI, no need
      # for the multi-arch QEMU pass that docker.yml does.
      - name: Build image (load into local docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: synchrotron-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          cluster_name: synchrotron-smoke

      - name: Side-load image into kind
        run: kind load docker-image synchrotron-server:smoke --name synchrotron-smoke

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Stage in-cluster git server
        run: |
          # synchrotron-cd-3sk: the controller fetches by URL, so a
          # local file:// from outside the pod won't work. Spin up
          # a tiny `git daemon` Deployment in-cluster pre-loaded
          # from the fixture ConfigMap.
          kubectl create namespace synchrotron-system
          kubectl -n synchrotron-system create configmap smoke-fixture \
            --from-file=cm.yaml=tests/smoke/cm.yaml
          kubectl apply -f tests/smoke/git-server.yaml
          kubectl -n synchrotron-system rollout status deploy/git-server --timeout=120s

      - name: Install synchrotron pointing at in-cluster git server
        run: |
          # Configure the controller with one repo (the in-cluster
          # git daemon URL) and one plugin (raw — parses .yaml/.yml
          # files in source path). Application is created via the
          # API after install since the chart only carries static
          # config; apps are runtime data.
          helm install synchrotron deploy/charts/synchrotron \
            --namespace synchrotron-system \
            --set image.repository=synchrotron-server \
            --set image.tag=smoke \
            --set image.pullPolicy=IfNotPresent \
            --set persistence.enabled=false \
            --set-json 'config.repos=[{"id":"sample","url":"git://git-server.synchrotron-system.svc:9418/sample.git","branch":"main"}]' \
            --set-json 'config.plugins=[{"name":"raw","kind":"raw","config":null}]' \
            --set 'config.polling.repo_interval_seconds=10' \
            --wait --timeout 4m

      - name: Verify rollout + create Application
        run: |
          kubectl -n synchrotron-system rollout status deploy/synchrotron --timeout=2m
          kubectl -n synchrotron-system port-forward svc/synchrotron 8484:8484 &
          PF_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8484/healthz; then break; fi
            sleep 1
          done
          # /healthz returns plain "ok"; /readyz returns JSON
          # ({"ready": true, "components": {...}}). curl -fS fails
          # on non-200.
          curl -fsS http://127.0.0.1:8484/healthz | tee /dev/stderr | grep -q "ok"
          curl -fsS http://127.0.0.1:8484/readyz  | tee /dev/stderr | grep -q '"ready":true'

          # Create the smoke Application via the API. Once it lands
          # the controller's pollers have a target; the render loop
          # will pick it up on the next RepoChanged.
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{
              "name":"smoke-app",
              "namespace":"default",
              "repo_url":"git://git-server.synchrotron-system.svc:9418/sample.git",
              "path":"manifests",
              "target_revision":"main",
              "dest_cluster":"in-cluster",
              "dest_namespace":"default"
            }' \
            http://127.0.0.1:8484/api/v1/apps
          kill $PF_PID || true

      - name: Wait for the rendered ConfigMap to land
        run: |
          # The poll loop publishes RepoChanged on HEAD movement,
          # which fans out to BOTH the render task and the
          # EventTrigger. Render is slower (clone → materialize →
          # plugin) than the trigger's enqueue, so the first
          # reconcile usually hits a still-empty DesiredStore and
          # fails with "app not found in desired-state cache".
          # There's no retry today. Workflow fix: push a fresh
          # commit periodically so additional RepoChanged events
          # keep firing; eventually render finishes first and
          # reconcile sees the desired entry. The real fix —
          # publish an event when render writes the DesiredStore —
          # is filed as 5bv.
          for i in $(seq 1 48); do
            kubectl -n synchrotron-system exec deploy/git-server -- sh -c '
              set -e
              rm -rf /tmp/bump
              git clone -q /srv/git/sample.git /tmp/bump
              cd /tmp/bump
              git config user.email smoke@synchrotron-cd.example
              git config user.name "synchrotron smoke"
              date > .bump
              git add .bump >/dev/null
              git commit -q -m "bump '$i'" || true
              git push -q origin main || true
            ' || true
            if kubectl -n default get configmap synchrotron-smoke-cm \
                -o jsonpath='{.data.marker}' 2>/dev/null \
                | grep -q "v1"; then
              echo "rendered ConfigMap landed after ${i}*5s"
              kubectl -n default get configmap synchrotron-smoke-cm -o yaml
              exit 0
            fi
            sleep 5
          done
          echo "ConfigMap synchrotron-smoke-cm did not land within 240s"
          exit 1

      - name: Show controller + git-server logs (always)
        if: always()
        run: |
          kubectl -n synchrotron-system get pods -o wide
          echo "--- synchrotron logs ---"
          kubectl -n synchrotron-system logs deploy/synchrotron --tail=300 || true
          echo "--- git-server logs ---"
          kubectl -n synchrotron-system logs deploy/git-server --tail=80 || true
          kubectl -n default get configmap || true
