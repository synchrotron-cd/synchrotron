name: bench

# Runs criterion microbenches and the synchrotron-bench scenario
# runner on each PR. Numbers from GitHub-hosted runners are noisy
# (shared CPU, varying neighbor load), so absolute regression
# detection is manual review of the uploaded artifacts; the only
# automatic gate is the per-app memory budget (--max-rss-kb-per-app),
# which is robust to CI noise because it's an order-of-magnitude
# check, not a percentage one.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-D warnings'

jobs:
  bench:
    name: criterion + scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Build release artifacts
        run: cargo build --release -p synchrotron-bench

      # Reduced sample size keeps wall time bounded on shared
      # runners. We don't try to detect regressions from these
      # numbers automatically (too noisy) — they're uploaded for
      # human review.
      - name: Run criterion benches
        run: |
          cargo bench --workspace -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 30 \
            | tee bench-output.txt

      - name: Run smoke scenario
        run: |
          mkdir -p reports
          ./target/release/synchrotron-bench \
            --scenario crates/synchrotron-bench/scenarios/smoke.yaml \
            --out reports/smoke.json

      # Budget guard. After d2p (slices 768/v3z/v50), local mem-1k
      # measures ~98 KB/app and 10k-apps ~92 KB/app. The accepted
      # design footprint is ~110 KB/app (1.1 GB for 10k apps, well
      # within typical container limits). CI guard at 130 KB/app
      # gives ~20% headroom for runner noise — catches a regression
      # past ~33% over the local baseline. Rationale documented in
      # crates/synchrotron-bench/RUNBOOK.md.
      - name: Memory budget guard (1k apps)
        run: |
          ./target/release/synchrotron-bench \
            --scenario crates/synchrotron-bench/scenarios/mem-1k.yaml \
            --max-rss-kb-per-app 130 \
            --out reports/mem-budget.json

      # y0v.4 acceptance gate: end-to-end webhook→sync p95 < 5000 ms.
      # Local 1k-app measurement is ~10 ms p95; CI runners (4 vCPU,
      # shared) run roughly 5–10× slower, so the 5000 ms target leaves
      # plenty of margin for runner noise.
      - name: Webhook latency budget guard
        run: |
          ./target/release/synchrotron-bench \
            --scenario crates/synchrotron-bench/scenarios/webhook-burst.yaml \
            --max-webhook-p95-ms 5000 \
            --out reports/webhook-budget.json

      - name: Print scenario summaries
        if: always()
        run: |
          for f in reports/*.json; do
            echo "=== $f ==="
            jq '{scenario, elapsed_seconds, reconciles, latency_us, throughput_per_second,
                 peak_rss_mb: (.memory.peak_rss_bytes / 1048576 | floor),
                 rss_kb_per_app: ((.memory.peak_rss_bytes / 1024) / .config.apps | floor)}' "$f"
          done

      - name: Upload bench reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: |
            reports/
            target/criterion/
            bench-output.txt
          retention-days: 14
