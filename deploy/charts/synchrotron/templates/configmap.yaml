apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synchrotron.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synchrotron.labels" . | nindent 4 }}
data:
  # Mounted at /etc/synchrotron/config.yaml. Schema in BUILD.md.
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
